<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Extended Try1</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
    }
    #left-panel {
      width: 80%;
      height: 100%;
      border-right: 2px solid #ccc;
    }
    #indexframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #right-panel {
      width: 20%;
      box-sizing: border-box;
      overflow-y: auto;
      padding-left: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      border: 1px solid #ccc;
      padding: 8px;
    }
  </style>
  <script>
    async function fetchCSV() {
        const response = await fetch('../../metadata/mriqc_vals.csv');
        const data = await response.text();
        const rows = data.split('\n').slice(1);
        const csvData = rows.map(row => {
        const values = row.split(',');
        return {
            name: values[0],
            gsr_y: parseFloat(values[1]),
            dvars_vstd: parseFloat(values[2]),
            fd_mean: parseFloat(values[3]),
            fber: parseFloat(values[4]),
            tsnr: parseFloat(values[5]),
            snr: parseFloat(values[6]),
            mriqc_fail: values[7]
        };
        });
        return csvData;
    }
    async function updateMetrics(displayText) {
      const data = await fetchCSV();
      const record = data.find(row => row.name === displayText);
      const rightPanel = document.getElementById('right-panel');

      if (record) {
        console.log("updating metrics"); // Debugging output
        rightPanel.innerHTML = `<h2>${record.name}</h2>` +
          '<h3>mriqc_vals</h3><table>' +
          Object.entries(record).slice(1).map(([key, value]) => `
            <tr>
              <td><a onclick="sortByMetric('${key}')"><u>${key}</u></a></td>
              <td>${value}</td>
            </tr>`).join('') +
          '</table><div id="metric-sorted"><h3>Metric Sorted</h3></div>';
      } else {
        rightPanel.innerHTML = '<h1>MRIQC Values</h1><p>No data available for this report.</p>';
      }
    }

    async function sortByMetric(metric) {
      const data = await fetchCSV();
      data.sort((a, b) => a[metric] - b[metric]);
      const sortedData = data.slice(0, 100);
      console.log("sorting metrics");
      const sortedSection = document.getElementById('metric-sorted');
      sortedSection.innerHTML = `<h3>${metric} sorted</h3><table>` +
        sortedData.map(row => {
        const metricValue = row[metric].toString().substring(0,4); 

        return `<tr><td><a onclick="sendToIndex('${row.name}','${row.mriqc_fail}')"><u>${row.name}</u></a></td>
            <td>${metricValue}</td>
            <td>${row.mriqc_fail}</td></tr>`}).join('') +
        '</table>';
        // not sure about row.name
    }

    // function sendToIndex(scanName,mriqc_status) {
    //     const iframe = document.getElementById('indexframe');
    //     // && iframe.contentWindow && iframe.contentWindow.goToReport_fromMetrics
    //     if (iframe && iframe.contentWindow?.goToReport_fromMetrics) {
    //       console.log('Function called in index.html');
    //       iframe.contentWindow.goToReport_fromMetrics(scanName);
    //     } else {
    //       console.error('Function not found or iframe not loaded.');
    //     }
    // };

    function sendToIndex(scanName, mriqc_status) {
      const iframe = document.getElementById('indexframe');
      if (iframe && iframe.contentWindow) {
        console.log('Sending message to index.html');
        iframe.contentWindow.postMessage({ type: 'goToReport_fromMetrics', scanName, mriqc_status }, '*');
      } else {
        console.error('iframe not loaded or missing.');
      }
    }
    
    window.addEventListener('message', (event) => {
      if (event.data.type === 'reportSelected') {
        updateMetrics(event.data.displayText);
      } else if (event.data.type === 'homePage') {
        document.getElementById('right-panel').innerHTML = '<h1>Features</h1><p>.</p>';
      }
    });

  </script>
  
</head>
<body>
  <!-- Left side: Displaying try1.html using an iframe -->
  <div id="left-panel">
    <iframe id="indexframe" src="../../index.html" title="index file"></iframe>
  </div>

  <!-- Right side: Space for additional features -->
  <div id="right-panel">
    <h1>Features</h1>
    <p>.</p>
  </div>
</body>
</html>
